services:
  postgres:
    image: postgres:16.9
    container_name: FinFlowDb
    environment:
      POSTGRES_DB : FinFlow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: FinFlowApp
    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/FinFlow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    ports:
      - "5442:8080"

    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge